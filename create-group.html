  <!-- MAIN DASHBOARD CONTENT -->
  <main class="dashboard-content">
    
    <div class="page-header">
      <div>
        <a href="groups.html" class="nav-item" style="padding:0; margin-bottom:0.5rem; display:inline-flex;">
          &larr; Back to Groups
        </a>
        <h1 class="page-title">Create New Njangi Group</h1>
        <p class="page-subtitle">Configure contribution amounts, payout rules, and rotation schedules.</p>
      </div>
    </div>

    <!-- FORM CARD -->
    <div class="card" style="max-width: 800px;">
      <form id="createGroupForm">
        
        <!-- SECTION 1: BASIC INFORMATION -->
        <div style="margin-bottom: 2rem;">
          <h3 style="color: #ffffff; font-size: 1.1rem; margin-bottom: 1rem; border-bottom: 1px solid #1f2937; padding-bottom: 0.5rem;">
            1. Group Details
          </h3>
          
          <div class="input-group">
            <label for="groupName">Group Name *</label>
            <input type="text" id="groupName" class="form-control" placeholder="e.g., Unity Savings Group 2026" required>
          </div>

          <div class="input-group">
            <label for="groupDescription">Description / Purpose</label>
            <textarea id="groupDescription" class="form-control" rows="3" placeholder="Briefly describe the purpose or rules of this group..."></textarea>
          </div>

          <div class="input-group">
            <label for="currency">Currency *</label>
            <select id="currency" class="form-control" required>
              <option value="XAF" selected>XAF - Central African CFA Franc</option>
              <option value="USD">USD - US Dollar ($)</option>
              <option value="EUR">EUR - Euro (€)</option>
              <option value="NGN">NGN - Nigerian Naira (₦)</option>
            </select>
          </div>
        </div>

        <!-- SECTION 2: CONTRIBUTION & ROTATION RULES -->
        <div style="margin-bottom: 2rem;">
          <h3 style="color: #ffffff; font-size: 1.1rem; margin-bottom: 1rem; border-bottom: 1px solid #1f2937; padding-bottom: 0.5rem;">
            2. Contribution & Schedule
          </h3>

          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem;">
            <div class="input-group">
              <label for="contributionAmount">Contribution Amount *</label>
              <input type="number" id="contributionAmount" class="form-control" placeholder="e.g., 50000" min="100" required>
            </div>

            <div class="input-group">
              <label for="frequency">Frequency *</label>
              <select id="frequency" class="form-control" required>
                <option value="weekly">Weekly</option>
                <option value="biweekly">Bi-Weekly (Every 2 weeks)</option>
                <option value="monthly" selected>Monthly</option>
              </select>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem;">
            <div class="input-group">
              <label for="startDate">First Cycle Start Date *</label>
              <input type="date" id="startDate" class="form-control" required>
            </div>

            <div class="input-group">
              <label for="maxMembers">Maximum Member Limit</label>
              <input type="number" id="maxMembers" class="form-control" placeholder="e.g., 12" min="2" max="100">
            </div>
          </div>
        </div>

        <!-- SECTION 3: PAYOUT METHOD -->
        <div style="margin-bottom: 2rem;">
          <h3 style="color: #ffffff; font-size: 1.1rem; margin-bottom: 1rem; border-bottom: 1px solid #1f2937; padding-bottom: 0.5rem;">
            3. Payout & Rotation Order
          </h3>

          <div class="input-group">
            <label for="payoutType">Rotation Method *</label>
            <select id="payoutType" class="form-control" required>
              <option value="fixed">Fixed Schedule (Pre-assigned slots)</option>
              <option value="random">Random Draw (Lottery at start)</option>
              <option value="bidding">Bidding System (Highest bidder wins pot)</option>
            </select>
          </div>

          <div class="input-group">
            <label for="lateFee">Late Payment Fine (Optional)</label>
            <input type="number" id="lateFee" class="form-control" placeholder="e.g., 2000 (Flat fee per day late)">
          </div>
        </div>

        <!-- SUBMIT BUTTONS -->
        <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
          <a href="groups.html" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary">Create Group</button>
        </div>

      </form>
    </div>

  </main>

  <script>
    // Simple Form Handler Demo
    document.getElementById('createGroupForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const groupName = document.getElementById('groupName').value;
      alert(`Group "${groupName}" created successfully! Redirecting to group list...`);
      
      // Redirect back to group list
      window.location.href = 'groups.html';
    });

    // Set default start date to today
    document.getElementById('startDate').valueAsDate = new Date();
  </script>
</body>
</html>
